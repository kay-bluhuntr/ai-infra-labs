# OpenTelemetry Collector: the single front door for metrics, logs and traces.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: otel-collector
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: https://open-telemetry.github.io/opentelemetry-helm-charts
      chart: opentelemetry-collector
      targetRevision: 0.182.0
      helm:
        releaseName: otel-collector
        valueFiles:
          - $values/values/otel-collector.yaml
    - repoURL: https://github.com/kay-bluhuntr/ai-infra-labs.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - SkipDryRunOnMissingResource=true   # its ServiceMonitor waits for the CRD from kube-prometheus-stack
    retry:
      limit: 10
      backoff: { duration: 15s, factor: 2, maxDuration: 3m }
