# Loki in single-binary mode with local filesystem storage. Fine for a laptop;
# real clusters use object storage (S3, GCS, Azure Blob).
deploymentMode: SingleBinary

loki:
  auth_enabled: false            # single tenant
  commonConfig:
    replication_factor: 1
  storage:
    type: filesystem
  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: loki_index_
          period: 24h
  limits_config:
    allow_structured_metadata: true   # needed for OTLP logs (trace_id, span_id)
    volume_enabled: true
    retention_period: 72h
  pattern_ingester:
    enabled: true

singleBinary:
  replicas: 1
  resources:
    requests: { cpu: 50m, memory: 256Mi }

# Zero out the other deployment modes.
backend: { replicas: 0 }
read: { replicas: 0 }
write: { replicas: 0 }
ingester: { replicas: 0 }
querier: { replicas: 0 }
queryFrontend: { replicas: 0 }
queryScheduler: { replicas: 0 }
distributor: { replicas: 0 }
compactor: { replicas: 0 }
indexGateway: { replicas: 0 }
bloomPlanner: { replicas: 0 }
bloomBuilder: { replicas: 0 }
bloomGateway: { replicas: 0 }

# Extras a laptop does not need. The two caches alone would ask for ~10 GB of RAM.
gateway: { enabled: false }
chunksCache: { enabled: false }
resultsCache: { enabled: false }
lokiCanary: { enabled: false }
test: { enabled: false }
minio: { enabled: false }
